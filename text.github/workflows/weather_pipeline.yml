```yaml
name: Kozminski Escape Live Weather Pipeline

on:
  workflow_dispatch:
    inputs:
      override_condition:
        description: 'Wymuszenie aury do testów gry:'
        required: true
        default: 'auto'
        type: choice
        options: [auto, rain, sunny, snow, night]

  push:
    branches: [main]
    paths:
      - 'fetch_weather.py'
      - '.github/workflows/**'

  schedule:
    - cron: '0 * * * *'  # Co godzinę

permissions:
  contents: write

jobs:
  update-campus-weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Pobranie pogody
        env:
          ACCUWEATHER_API_KEY: ${{ secrets.ACCUWEATHER_API_KEY }}
        run: python fetch_weather.py --override "${{ inputs.override_condition || 'auto' }}"
      - name: Commit i push zmian bota
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ js/weather.js reports/ index.html
          git commit -m "chore(weather): aktualizacja aury na kampusie ALK [skip ci]" || echo "Brak zmian"
          git push
```
